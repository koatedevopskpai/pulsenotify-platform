name: PulseNotify CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Lint with flake8
        run: flake8 app

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

      # The image push needs Docker Hub credentials. This is a public reference
      # repo with no Docker Hub secrets configured, so the publish steps are
      # skipped rather than failing the build. Set DOCKERHUB_USERNAME and
      # DOCKERHUB_TOKEN to enable them. (Check the code: the lint/test steps above
      # are unaffected and still run unconditionally.)
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DH_USER" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME not set - skipping image build and push."
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pulsenotify:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pulsenotify:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          # 1.11 required: terraform/main.tf's S3 backend uses `use_lockfile`,
          # which Terraform only supports from 1.10 onwards.
          terraform_version: "1.11"
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate
