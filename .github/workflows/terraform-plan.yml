name: Terraform Plan

# This job needs AWS credentials to reach the S3 state backend. This is a public
# reference repo with no AWS credentials configured, so the plan steps are
# skipped when they are absent rather than failing on an empty-credential init.
# Set AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (and TF_VAR_db_password) to
# enable a real plan.
#
# Terraform is pinned to 1.11 because terraform/main.tf uses `use_lockfile` in
# its S3 backend block, which is only supported from Terraform 1.10 onwards.

on:
  pull_request:
    paths:
      - "terraform/**"

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS credentials
        id: awscreds
        env:
          AK: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$AK" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS credentials not set - skipping terraform plan."
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.awscreds.outputs.available == 'true'
        with:
          terraform_version: "1.11"

      - name: Terraform Init
        if: steps.awscreds.outputs.available == 'true'
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        if: steps.awscreds.outputs.available == 'true'
        id: plan
        run: terraform plan -no-color
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

      - uses: actions/github-script@v7
        if: steps.awscreds.outputs.available == 'true'
        with:
          script: |
            const output = `### Terraform Plan
            <details><summary>Show Plan</summary>
            \`\`\`\n
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
